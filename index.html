<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart AI Recruitment Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
padding:30px;
color:white;
}

.container{
max-width:1100px;
margin:auto;
background:#ffffff10;
backdrop-filter:blur(10px);
border-radius:20px;
padding:25px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h1{
text-align:center;
margin-bottom:25px;
font-size:34px;
color:#38bdf8;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.input-box{
display:flex;
flex-direction:column;
}

label{
margin-bottom:6px;
font-size:14px;
}

input,textarea,select{
padding:12px;
border:none;
border-radius:10px;
outline:none;
font-size:14px;
background:#f1f5f9;
}

textarea{
resize:none;
height:90px;
}

.buttons{
margin-top:20px;
display:flex;
gap:15px;
flex-wrap:wrap;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
transition:0.3s;
}

.analyze{
background:#0ea5e9;
color:white;
}

.analyze:hover{
background:#0284c7;
}

.clear{
background:#ef4444;
color:white;
}

.clear:hover{
background:#dc2626;
}

.result-card{
margin-top:25px;
background:white;
color:black;
padding:20px;
border-radius:15px;
animation:fadeIn 0.5s ease;
}

.score{
font-size:50px;
font-weight:bold;
color:#0ea5e9;
}

.status{
padding:8px 15px;
display:inline-block;
border-radius:30px;
margin-top:10px;
font-weight:bold;
}

.shortlisted{
background:#22c55e;
color:white;
}

.rejected{
background:#ef4444;
color:white;
}

.average{
background:#f59e0b;
color:white;
}

table{
width:100%;
margin-top:25px;
border-collapse:collapse;
overflow:hidden;
border-radius:15px;
background:white;
color:black;
}

th{
background:#0ea5e9;
color:white;
padding:12px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #ddd;
}

.progress{
width:100%;
background:#ddd;
height:12px;
border-radius:20px;
overflow:hidden;
margin-top:8px;
}

.bar{
height:100%;
background:#0ea5e9;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:25px;
}

.card{
background:#ffffff15;
padding:20px;
border-radius:15px;
text-align:center;
}

.card h2{
font-size:30px;
margin-top:10px;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:700px){

.form-grid{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<h1>Smart AI Recruitment Dashboard</h1>

<div class="form-grid">

<div class="input-box">
<label>Candidate Name</label>
<input type="text" id="name" placeholder="Enter full name">
</div>

<div class="input-box">
<label>Email</label>
<input type="email" id="email" placeholder="Enter email">
</div>

<div class="input-box">
<label>Skills</label>
<textarea id="skills" placeholder="Python, React, ML, SQL"></textarea>
</div>

<div class="input-box">
<label>Experience</label>
<select id="experience">
<option>Fresher</option>
<option>1-2 Years</option>
<option>3-5 Years</option>
<option>5+ Years</option>
</select>
</div>

</div>

<div class="buttons">
<button class="analyze" onclick="analyzeCandidate()">Analyze Candidate</button>
<button class="clear" onclick="clearForm()">Clear</button>
</div>

<div id="result"></div>

<div class="dashboard">

<div class="card">
<p>Total Candidates</p>
<h2 id="total">0</h2>
</div>

<div class="card">
<p>Shortlisted</p>
<h2 id="shortlisted">0</h2>
</div>

<div class="card">
<p>Rejected</p>
<h2 id="rejected">0</h2>
</div>

<div class="card">
<p>Average Score</p>
<h2 id="average">0%</h2>
</div>

</div>

<table>

<thead>
<tr>
<th>Candidate ID</th>
<th>Name</th>
<th>Score</th>
<th>Role</th>
<th>Status</th>
<th>AI Remark</th>
</tr>
</thead>

<tbody id="tableData">
</tbody>

</table>

</div>

<script>

let total=0;
let shortlisted=0;
let rejected=0;
let totalScore=0;

function analyzeCandidate(){

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let skills=document.getElementById("skills").value.toLowerCase();
let exp=document.getElementById("experience").value;
let candidateId=`CAND-${String(total+1).padStart(4,"0")}`;

if(name==="" || email===""){
alert("Please fill all fields");
return;
}

let score=40;

if(skills.includes("python")) score+=15;
if(skills.includes("react")) score+=15;
if(skills.includes("ml")) score+=20;
if(skills.includes("sql")) score+=10;
if(skills.includes("javascript")) score+=10;

if(exp==="1-2 Years") score+=5;
if(exp==="3-5 Years") score+=10;
if(exp==="5+ Years") score+=15;

let role="Junior Developer";
let status="Rejected";
let remark="Average Profile";

if(score>=85){
role="AI Engineer";
status="Shortlisted";
remark="Excellent Technical Match";
shortlisted++;
}
else if(score>=70){
role="Frontend Developer";
status="Average";
remark="Good Potential";
}
else{
rejected++;
}

total++;
totalScore+=score;

document.getElementById("total").innerText=total;
document.getElementById("shortlisted").innerText=shortlisted;
document.getElementById("rejected").innerText=rejected;
document.getElementById("average").innerText=
Math.round(totalScore/total)+"%";

let statusClass="rejected";

if(status==="Shortlisted"){
statusClass="shortlisted";
}
else if(status==="Average"){
statusClass="average";
}

document.getElementById("result").innerHTML=`

<div class="result-card">

<p><b>Candidate ID:</b> ${candidateId}</p>

<h2>${name}</h2>

<p><b>Email:</b> ${email}</p>

<p><b>Recommended Role:</b> ${role}</p>

<div class="score">${score}%</div>

<div class="progress">
<div class="bar" style="width:${score}%"></div>
</div>

<div class="status ${statusClass}">
${status}
</div>

<p style="margin-top:15px;">
<b>AI Remark:</b> ${remark}
</p>

</div>

`;

let row=`

<tr>

<td>${candidateId}</td>

<td>${name}</td>

<td>${score}%</td>

<td>${role}</td>

<td>${status}</td>

<td>${remark}</td>

</tr>

`;

document.getElementById("tableData").innerHTML+=row;

clearForm();

}

function clearForm(){

document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("skills").value="";
document.getElementById("experience").selectedIndex=0;

}

</script>

</body>
</html>
